name: Test Suite

on:
  pull_request:
    branches: [main, playground]
  push:
    branches: [main, playground]

permissions:
  contents: read

# Cancel in-progress runs on same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # hashFiles() is NOT valid in a job-level `if:` (only step-level) — using it there
  # made GitHub reject the whole workflow ("workflow file issue"). Detect package
  # presence once here and gate the backend jobs on this output instead.
  detect-packages:
    name: Detect packages
    runs-on: ubuntu-latest
    outputs:
      has_packages: ${{ steps.check.outputs.has_packages }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check for packages/*
        id: check
        run: |
          if [ -f packages/shared/package.json ]; then
            echo "has_packages=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
          fi

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Backend/monorepo job — runs only when packages/* is present (skips on the
    # frontend-only playground; auto-runs if the monorepo packages are restored).
    needs: detect-packages
    if: needs.detect-packages.outputs.has_packages == 'true'
    env:
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        run: npm install -g pnpm@9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build dependency order: shared → api/keeper/indexer
      - name: Build shared package
        run: pnpm --filter @percolator/shared build

      - name: Run unit tests (shared)
        run: pnpm --filter @percolator/shared test

      - name: Run unit tests (api)
        run: pnpm --filter @percolator/api test

      - name: Run unit tests (keeper)
        run: pnpm --filter @percolator/keeper test

      - name: Run unit tests (indexer)
        run: pnpm --filter @percolator/indexer test

      - name: Run unit tests (app)
        run: pnpm --filter app test

      - name: Upload coverage (shared)
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        if: always() && env.HAS_CODECOV_TOKEN == 'true'
        with:
          files: ./packages/shared/coverage/coverage-final.json
          flags: unit-shared
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - name: Upload coverage (api)
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        if: always() && env.HAS_CODECOV_TOKEN == 'true'
        with:
          files: ./packages/api/coverage/coverage-final.json
          flags: unit-api
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: detect-packages
    if: needs.detect-packages.outputs.has_packages == 'true'

    env:
      RPC_URL: ${{ secrets.DEVNET_RPC_URL || 'https://api.devnet.solana.com' }}
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        run: npm install -g pnpm@9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build dependency order before running tests
      - name: Build shared package
        run: pnpm --filter @percolator/shared build

      - name: Run integration tests (api)
        run: pnpm --filter @percolator/api test

      - name: Run integration tests (indexer)
        run: pnpm --filter @percolator/indexer test

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        if: always() && env.HAS_CODECOV_TOKEN == 'true'
        with:
          files: ./packages/api/coverage/coverage-final.json
          flags: integration
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skip on the app-only playground (no packages/* backend + no e2e suite wired).
    needs: detect-packages
    if: needs.detect-packages.outputs.has_packages == 'true'

    env:
      RPC_URL: ${{ secrets.DEVNET_RPC_URL || 'https://api.devnet.solana.com' }}
      TEST_WALLET_PRIVATE_KEY: ${{ secrets.TEST_WALLET_PRIVATE_KEY }}
      BASE_URL: http://localhost:3000
      # Privy validates appId.length === 25 exactly; use the secret when available,
      # otherwise fall back to a 25-char placeholder so the server starts in CI.
      NEXT_PUBLIC_PRIVY_APP_ID: ${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID || 'cltestappid00000000000000' }}
      NEXT_PUBLIC_DEFAULT_NETWORK: devnet
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://percolator-api-production.up.railway.app' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        run: npm install -g pnpm@9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: pnpm run build

      # Playwright auto-starts the production server (pnpm start) via webServer config.
      # The check below skips E2E when no test files exist (e.g. new packages).
      - name: Check for E2E tests
        id: e2e-check
        run: |
          if [ -d "e2e" ] || [ -d "tests/e2e" ] || compgen -G "**/*.e2e.ts" > /dev/null 2>&1; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  No E2E test files found — skipping"
          fi

      - name: Run E2E tests
        if: steps.e2e-check.outputs.has_tests == 'true'
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: always() && steps.e2e-check.outputs.has_tests == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test results
        if: always() && steps.e2e-check.outputs.has_tests == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  coverage-check:
    name: Coverage Gate
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check coverage thresholds
        run: |
          echo "📊 Coverage check"
          echo "⚠️  Coverage gate temporarily disabled until tests are implemented"
          echo "✅ Once tests are written, this will enforce:"
          echo "   - Overall coverage ≥90%"
          echo "   - Critical paths 100%"
          echo "   - No coverage regressions"

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-packages
    if: needs.detect-packages.outputs.has_packages == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        run: npm install -g pnpm@9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail on high+ severity. Accepted findings are listed in root package.json
      # pnpm.auditConfig (must match SECURITY-DEPS.md).
      - name: Build shared package
        run: pnpm --filter @percolator/shared build

      - name: Run security audit
        run: pnpm audit --audit-level=high

      - name: Run security tests (shared)
        run: pnpm --filter @percolator/shared test

      - name: Run security tests (api)
        run: pnpm --filter @percolator/api test

  # The app's own suite (2702 tests). Every other test job above is gated on
  # `packages/*`, which no longer exists on playground or main — so before this
  # job, CI ran no tests at all while ✅ Merge Gate still reported green (#2447).
  #
  # NON-BLOCKING ON PURPOSE (`continue-on-error`). Clean playground currently has
  # 95 failing tests across 28 files; making this a hard gate on day one would
  # wall off every open PR for failures none of them introduced. This lands the
  # measurement first — the number becomes visible in the job summary on every
  # PR. Flipping it to blocking is the follow-up once the suite is green, and
  # is the whole point of landing it: see #2447.
  app-tests:
    name: App Tests (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        run: npm install -g pnpm@9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm test` is `vitest run`. Tee so the tail lands in the step summary
      # even on failure — the count is the deliverable here, not the exit code.
      - name: Run app test suite
        id: run
        run: |
          set -o pipefail
          cd app && pnpm test 2>&1 | tee /tmp/app-tests.log

      - name: Summarise results
        if: always()
        run: |
          {
            echo "### App test suite (\`cd app && pnpm test\`)"
            echo
            # Strip ANSI *before* matching: vitest emits the colour escape
            # ahead of the leading whitespace ("\e[2m Test Files"), so an
            # anchored ^[[:space:]]* never matches the raw line.
            counts="$(sed 's/\x1b\[[0-9;]*m//g' /tmp/app-tests.log 2>/dev/null \
              | grep -E '^[[:space:]]*(Test Files|Tests)[[:space:]]' || true)"
            if [ -n "$counts" ]; then
              printf '%s\n' "$counts" | sed 's/^/    /'
            else
              echo "    Suite did not reach a result line — see the job log."
            fi
            echo
            if [ "${{ steps.run.outcome }}" = "success" ]; then
              echo "Suite is green. It can now be made blocking — see #2447."
            else
              echo "Suite is red. This job is non-blocking, so it does NOT gate this PR (#2447)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        run: npm install -g pnpm@9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Real type-safety gate: tsc --noEmit on the app. `next build` no longer
      # type-checks (ignoreBuildErrors is on so a stray error can't block deploys),
      # so this is where types are actually enforced on every PR.
      - name: Type check
        run: pnpm --filter app exec tsc --noEmit

  merge-gate:
    name: ✅ Merge Gate
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests, security-tests, type-check]
    # Run even when backend jobs are skipped (e.g. waitlist-only forks where packages/* is absent).
    # Fail only on actual failure or cancellation of a needed job.
    if: ${{ always() && github.event_name == 'pull_request' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}

    steps:
      # This gate reports what actually ran. It previously printed "All test
      # suites passed" unconditionally — but four of its five dependencies are
      # permanently skipped (no `packages/*`), so that line certified nothing
      # and reviewers reasonably read the green tick as "tests passed" (#2447).
      # Skipped still does not fail the gate; it is just no longer reported as
      # a pass. `app-tests` is deliberately NOT in `needs`: it is non-blocking,
      # and depending on it would put this gate's outcome at the mercy of
      # continue-on-error result semantics for no gain. Read its own job
      # summary for the real pass/fail count.
      - name: Report what actually ran
        run: |
          report() {
            case "$2" in
              success) echo "✅ $1: passed" ;;
              skipped) echo "⏭️  $1: SKIPPED — this check certifies nothing" ;;
              *)       echo "⚠️  $1: $2" ;;
            esac
          }
          report "Unit Tests"        "${{ needs.unit-tests.result }}"
          report "Integration Tests" "${{ needs.integration-tests.result }}"
          report "E2E Tests"         "${{ needs.e2e-tests.result }}"
          report "Security Tests"    "${{ needs.security-tests.result }}"
          report "Type Check"        "${{ needs.type-check.result }}"
          echo "ℹ️  App Tests: non-blocking — see its job summary for pass/fail counts"
          echo
          echo "No required job failed. Skipped jobs are not evidence of passing tests."
